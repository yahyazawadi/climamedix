<svg xmlns="http://www.w3.org/2000/svg" viewBox="-86 42 174 174" width="400" height="400" style="background:#080f1d; border-radius: 20px;">
  <defs>
    <!-- ClimaMedix Brand Ocean Blue Radial Gradient -->
    <radialGradient id="cmOceanGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#016c7f" />
      <stop offset="60%" stop-color="#004c6d" />
      <stop offset="100%" stop-color="#08294a" />
    </radialGradient>

    <!-- ClimaMedix Brand Land Green Linear Gradient -->
    <linearGradient id="cmLandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15b47a" />
      <stop offset="100%" stop-color="#2fad78" />
    </linearGradient>

    <style>
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes planetSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .orbit-group {
        transform-origin: 1px 129px;
        animation: orbitSpin 3s linear infinite;
      }
      .globe-group {
        transform-origin: 1px 129px;
        animation: planetSpin 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Static Outer Track Guide -->
  <circle cx="1" cy="129" r="73" fill="none" stroke="rgba(21, 180, 122, 0.25)" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Animated Orbit Spinner + Glowing Beacon -->
  <g class="orbit-group">
    <circle cx="1" cy="129" r="73" fill="none" stroke="#15b47a" stroke-width="2.2" stroke-dasharray="70 190" stroke-linecap="round" />
    <circle cx="1" cy="56" r="4" fill="#ffffff" stroke="#15b47a" stroke-width="1.5" />
  </g>

  <!-- Rotating Earth Globe -->
  <g class="globe-group">
    <!-- Planet Background Sphere (Brand Green Continents) -->
    <path d="M4.8,189.6c33.5-2,59-30.9,56.8-64.4c-2-33.5-30.9-59-64.4-56.8c-33.5,2-59,30.9-56.8,64.4C-57.6,166.2-28.7,191.6,4.8,189.6z" fill="url(#cmLandGrad)" />

    <!-- Ocean Body Cutout (ClimaMedix Brand Blue Ocean) -->
    <path d="M-12.6,116.5c-1.7-3.3,3.1-5.1,5.6-7.6c3.1-3.3,9.8-8.7,9-10.7C1.2,96-5.6,90-9.3,91.4c-0.8,0-5.1,4.8-6.1,5.6c0-1.7-0.3-2.6-0.3-4.2c0-1.1-2.2-2-2-2.8c0.2-1.9,4.8-5.4,5.9-6.8c-0.9-0.6-4-2.8-4.8-2.5c-2,1.1-4.5,1.9-6.7,2.8c0-0.8-0.2-1.6-0.3-2c4.2-2.2,8.7-3.7,13.4-4.8l4.2,1.6l3.1,3.3l3.1,2.9c0,0,1.9,0.8,2.6,0.8c0.9-0.2,3.9-4,3.9-4l-1.2-2.9l-0.2-2.6c8.4,0.8,16.1,3.3,23.1,7.6c-1.1,0.2-2.6,0.3-4,0.8c-0.6-0.3-3.9,0.3-3.7,1.7c0.2,1.1,5.9,5.7,8.4,9.8c2.5,4.2,9.5,6.8,10.7,11.5c1.2,5.4-0.8,12.4,0.2,18.9c0.9,6.4,7.9,13,7.9,13s3.1,0.9,5.6,0.3c-1.9,9.5-6.1,18.2-12.6,25.6c-7.3,8.2-16.5,14-26.9,16.5c1.2-3.7,3.7-7.3,6.1-9.3c2-1.9,4.5-5.1,5.4-7.6c0.9-2.6,2.2-4.8,3.7-7.3c1.9-3.3-5.7-7.9-8.2-8.7c-5.6-2-9.8-4.8-14.6-7.9c-3.6-2.2-14.3,2.8-18.3,1.2c-5.4-2-7.3-3.7-12.1-6.8c-5-3.3-3.6-10.2-3.9-15.4c3.7,0,8.8-1.6,11.5,1.2c0.8,0.9,3.7,4.8,5.4,3.3C-9.2,122.3-12,117.6-12.6,116.5z M-42.4,97.4c0.3,2.6,1.7,4.7,1.7,6.5c0,7.3-0.6,11.6,4,17.4c1.9,2.2,2.5,5.6,3.3,8.4c0.9,2.6,4,3.9,6.4,5.4c4.5,2.9,8.8,6.7,13.7,9.3c3.1,1.7,5,2.6,4.5,6.4c-0.6,2.9-0.6,4.8-2,7.6c-0.3,0.9,2.2,5.9,2.9,6.5c2.5,2,4.8,4,7.5,5.9c4,2.9,0,7.3-1.6,11.8c-11.8-0.8-23.1-5.4-32.3-13.4c-10.7-9.5-17.1-22.7-18-36.8C-53.3,119.5-50.2,107.5-42.4,97.4z" fill="url(#cmOceanGrad)" />

    <!-- Thin Atmosphere Glow Rim -->
    <circle cx="1" cy="129" r="60.6" fill="none" stroke="#15b47a" stroke-width="1.2" opacity="0.6" />
  </g>
</svg>
